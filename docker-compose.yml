services:
  qr-api:
    build: .
    container_name: qr-api
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      QR_API_KEY: ${QR_API_KEY}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PORT: 7860
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - tunnel-net

networks:
  tunnel-net:
    external: true